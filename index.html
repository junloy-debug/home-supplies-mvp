<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>屋企日用品</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #183128;
      --muted: #64736b;
      --line: #d9e4dc;
      --paper: #fbfcfa;
      --leaf: #237552;
      --leaf-dark: #16563b;
      --soft-green: #e8f4ec;
      --warm: #fff8e9;
      --danger: #b3261e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: #f1f5f1;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    header { margin: 4px 4px 22px; }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--leaf);
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .08em;
    }

    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: 6px; font-size: clamp(1.8rem, 8vw, 2.35rem); letter-spacing: -.04em; }
    h2 { margin-bottom: 16px; font-size: 1.1rem; }
    .intro { margin-bottom: 0; color: var(--muted); font-size: .95rem; }

    .card {
      margin-bottom: 16px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--paper);
      box-shadow: 0 3px 12px rgba(24, 49, 40, .04);
    }

    .total-card { background: var(--leaf); color: #fff; border: 0; }
    .total-label { margin-bottom: 8px; font-size: .92rem; font-weight: 600; }
    .total-amount { margin: 0; font-size: clamp(2rem, 11vw, 3rem); font-weight: 800; letter-spacing: -.045em; }
    .total-note { margin: 7px 0 0; color: #d8f2e3; font-size: .82rem; }

    form { display: grid; gap: 14px; }
    .two-up { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { display: grid; gap: 7px; color: var(--ink); font-size: .9rem; font-weight: 700; }
    input, select, button { font: inherit; }
    input, select {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid #b9c9be;
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
    }
    input:focus, select:focus { outline: 3px solid #bde2ca; outline-offset: 1px; border-color: var(--leaf); }
    .hint { margin: -7px 0 0; color: var(--muted); font-size: .78rem; }
    button {
      min-height: 48px;
      border: 0;
      border-radius: 10px;
      background: var(--leaf);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }
    button:hover { background: var(--leaf-dark); }
    button:focus-visible { outline: 3px solid #a9dcb9; outline-offset: 2px; }

    .list-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .list-heading p { margin-bottom: 16px; color: var(--muted); font-size: .83rem; }
    .item-list { display: grid; gap: 10px; }
    .item-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px 16px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #fff;
    }
    .item-name { margin: 0; font-size: 1rem; font-weight: 800; }
    .item-meta { margin: 5px 0 0; color: var(--muted); font-size: .82rem; }
    .remaining { align-self: center; text-align: right; }
    .remaining-label { display: block; color: var(--muted); font-size: .75rem; }
    .remaining-value { display: block; margin-top: 2px; font-size: 1.18rem; font-weight: 800; }
    .monthly-spend { grid-column: 1 / -1; padding-top: 10px; border-top: 1px solid #edf1ed; color: var(--muted); font-size: .83rem; }
    .monthly-spend strong { color: var(--ink); }
    .threshold-control { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid #edf1ed; color: var(--muted); font-size: .83rem; }
    .threshold-control input { width: 86px; min-height: 38px; padding: 6px 8px; }
    .low-stock-status { grid-column: 1 / -1; margin: 0; color: var(--danger); font-size: .88rem; font-weight: 800; }
    .empty-state { margin: 0; padding: 18px 4px; color: var(--muted); text-align: center; }

    @media (min-width: 560px) {
      main { padding: 44px 24px 56px; }
      .form-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 14px; }
      .form-grid .full { grid-column: 1 / -1; }
      .item-row { grid-template-columns: minmax(0, 1fr) 125px 155px; align-items: center; }
      .monthly-spend { grid-column: auto; border-top: 0; border-left: 1px solid #edf1ed; padding: 0 0 0 16px; }
      .threshold-control, .low-stock-status { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">屋企日用品</p>
      <h1>記低，先唔會斷貨。</h1>
      <p class="intro">加入每次買咗或用咗嘅紀錄，屋企用品一目了然。</p>
    </header>

    <section class="card total-card" aria-labelledby="monthly-title">
      <p id="monthly-title" class="total-label">本月屋企使費</p>
      <p id="total-amount" class="total-amount">HK$0.00</p>
      <p id="total-note" class="total-note">暫未計算</p>
    </section>

    <section class="card" aria-labelledby="entry-title">
      <h2 id="entry-title">加入一筆</h2>
      <form id="record-form">
        <div class="form-grid">
          <label class="full">物品名
            <input id="item-name" type="text" placeholder="例如：廁紙" aria-label="物品名" required>
          </label>
          <label>類型
            <select id="record-type" aria-label="類型">
              <option value="買咗">買咗</option>
              <option value="用咗">用咗</option>
            </select>
          </label>
          <label>數量
            <input id="quantity" type="number" inputmode="decimal" min="0" step="1" placeholder="例如：2" aria-label="數量" required>
          </label>
          <label>金額（港幣）
            <input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="例如：28.00" aria-label="金額（港幣）" required>
          </label>
          <label>日期
            <input id="record-date" type="date" aria-label="日期" required>
          </label>
        </div>
        <p class="hint">「買咗」先需要填金額。</p>
        <button type="submit">加入紀錄</button>
      </form>
    </section>

    <section class="card" aria-labelledby="items-title">
      <div class="list-heading">
        <h2 id="items-title">而家有咩</h2>
        <p>按物品匯總</p>
      </div>
      <div id="item-list" class="item-list" aria-live="polite"></div>
    </section>
  </main>
  <script>
    const storageKey = 'home-supplies-data';
    const form = document.getElementById('record-form');
    const typeInput = document.getElementById('record-type');
    const amountInput = document.getElementById('amount');
    const dateInput = document.getElementById('record-date');
    const itemList = document.getElementById('item-list');
    const totalAmount = document.getElementById('total-amount');
    const totalNote = document.getElementById('total-note');
    const today = () => new Date().toLocaleDateString('en-CA');

    // Records retain their existing structure. Thresholds are the only saved setting added.
    function readData() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || '{"records":[],"thresholds":{}}');
        return { records: Array.isArray(saved.records) ? saved.records : [], thresholds: saved.thresholds && typeof saved.thresholds === 'object' ? saved.thresholds : {} };
      } catch { return { records: [], thresholds: {} }; }
    }
    function writeData(data) { localStorage.setItem(storageKey, JSON.stringify(data)); }
    function parseAmountCents(value) { const [whole, fraction = ''] = value.split('.'); return Number(whole) * 100 + Number(`${fraction}00`.slice(0, 2)); }

    // Logic layer: all quantities and monthly spending are derived from records.
    function getRemainingQuantity(records, itemName) {
      return records
        .filter((record) => record.itemName === itemName)
        .reduce((remaining, record) => {
          const quantity = Number(record.quantity) || 0;
          return record.type === '買咗' ? remaining + quantity : remaining - quantity;
        }, 0);
    }

    function getRecordAmountCents(record) {
      return Number.isInteger(record.amountCents) ? record.amountCents : 0;
    }

    function getCurrentMonthSpendCents(records, today = new Date()) {
      const monthPrefix = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;

      return records
        .filter((record) => record.type === '買咗' && record.date.startsWith(monthPrefix))
        .reduce((totalCents, record) => totalCents + getRecordAmountCents(record), 0);
    }

    function formatHKD(cents) {
      return `HK$${(cents / 100).toFixed(2)}`;
    }

    function getItemMonthSpendCents(records, itemName, now = new Date()) {
      return getCurrentMonthSpendCents(records.filter((record) => record.itemName === itemName), now);
    }

    function getLowStockStatus(remaining, threshold) {
      if (threshold === undefined || threshold === null || threshold === '') return '';
      if (remaining < 0) return '數對唔上';
      if (remaining === 0) return '用完咗';
      return remaining <= Number(threshold) ? '就快用完' : '';
    }

    function render() {
      const { records, thresholds } = readData();
      const names = [...new Set(records.map((record) => record.itemName))];
      const monthlyTotal = getCurrentMonthSpendCents(records);
      totalAmount.textContent = formatHKD(monthlyTotal);
      totalNote.textContent = `${new Date().getFullYear()} 年 ${new Date().getMonth() + 1} 月`;
      itemList.replaceChildren();
      if (!names.length) {
        const empty = document.createElement('p'); empty.className = 'empty-state'; empty.textContent = '未有紀錄，加第一筆啦'; itemList.append(empty); return;
      }
      names.forEach((itemName) => {
        const remaining = getRemainingQuantity(records, itemName);
        const threshold = thresholds[itemName];
        const status = getLowStockStatus(remaining, threshold);
        const row = document.createElement('article'); row.className = 'item-row';
        row.innerHTML = '<div><p class="item-name"></p></div><div class="remaining"><span class="remaining-label">仲剩</span><span class="remaining-value"></span></div><p class="monthly-spend">呢個月使咗幾多錢：<strong></strong></p><label class="threshold-control">低量門檻<input type="number" inputmode="decimal" min="0" step="1" placeholder="未設定"></label>';
        row.querySelector('.item-name').textContent = itemName;
        row.querySelector('.remaining-value').textContent = remaining;
        row.querySelector('.monthly-spend strong').textContent = formatHKD(getItemMonthSpendCents(records, itemName));
        const thresholdInput = row.querySelector('input');
        if (threshold !== undefined) thresholdInput.value = threshold;
        thresholdInput.addEventListener('input', () => {
          const next = readData();
          if (thresholdInput.value === '') delete next.thresholds[itemName];
          else next.thresholds[itemName] = Number(thresholdInput.value);
          writeData(next); render();
        });
        if (status) { const statusElement = document.createElement('p'); statusElement.className = 'low-stock-status'; statusElement.textContent = status; row.append(statusElement); }
        itemList.append(row);
      });
    }

    function syncAmountField() { const isPurchase = typeInput.value === '買咗'; amountInput.disabled = !isPurchase; amountInput.required = isPurchase; if (!isPurchase) amountInput.value = ''; }
    typeInput.addEventListener('change', syncAmountField);
    form.addEventListener('submit', (event) => {
      event.preventDefault(); if (!form.reportValidity()) return;
      const data = readData(); const type = typeInput.value;
      const record = { itemName: document.getElementById('item-name').value.trim(), type, quantity: Number(document.getElementById('quantity').value), date: dateInput.value };
      if (type === '買咗') record.amountCents = parseAmountCents(amountInput.value);
      data.records.push(record);
      writeData(data); form.reset(); dateInput.value = today(); syncAmountField(); render();
    });

    document.getElementById('record-date').value = new Date().toLocaleDateString('en-CA');

    function selfCheck() {
      const failures = [];
      const assert = (condition, message) => {
        if (!condition) failures.push(message);
      };
      const now = new Date();
      const currentMonthDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;
      const previousMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
      const previousMonthDate = `${previousMonth.getFullYear()}-${String(previousMonth.getMonth() + 1).padStart(2, '0')}-01`;
      const records = [
        { itemName: '測試紙巾', type: '買咗', quantity: 10, date: currentMonthDate, amountCents: 10 },
        { itemName: '測試紙巾', type: '用咗', quantity: 3, date: currentMonthDate },
        { itemName: '測試紙巾', type: '買咗', quantity: 0, date: currentMonthDate, amountCents: 20 },
        { itemName: '測試紙巾', type: '買咗', quantity: 0, date: previousMonthDate, amountCents: 999 }
      ];
      const remaining = getRemainingQuantity(records, '測試紙巾');
      const currentMonthCents = getCurrentMonthSpendCents(records, now);

      assert(remaining === 7, `(a) 預期剩 7，實際係 ${remaining}`);
      assert(formatHKD(currentMonthCents) === 'HK$0.30', `(b) 預期 HK$0.30，實際係 ${formatHKD(currentMonthCents)}`);
      assert(currentMonthCents === 30 && currentMonthCents !== getRecordAmountCents(records[3]),
        `(c) 上個月 HK$9.99 被錯誤計入本月使費：${formatHKD(currentMonthCents)}`);
      assert(getLowStockStatus(0, undefined) === '', '(d) 未設門檻時剩 0 不應顯示狀態');
      assert(getLowStockStatus(0, 1) === '用完咗', '(e) 有門檻時剩 0 應顯示「用完咗」');
      assert(getLowStockStatus(-1, 1) === '數對唔上', '(f) 有門檻時負數應顯示「數對唔上」');
      assert(getLowStockStatus(2, 2) === '就快用完', '(g) 餘量等於門檻應顯示「就快用完」');

      if (failures.length) {
        failures.forEach((failure) => console.error(failure));
        return false;
      }

      console.log('selfCheck 全過');
      return true;
    }
    dateInput.value = today();
    syncAmountField();
    render();
    selfCheck();
  </script>
</body>
</html>
