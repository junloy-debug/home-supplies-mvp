<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>屋企日用品</title>
  <style>
    :root { --ink:#173127; --muted:#66756d; --line:#d8e4db; --paper:#fbfcfa; --leaf:#237552; --danger:#a32626; }
    * { box-sizing:border-box; } body { margin:0; min-width:320px; background:#f0f5f1; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100%,720px); margin:auto; padding:24px 16px 42px; } h1,h2,p { margin-top:0; } h1 { margin:0 0 7px; font-size:clamp(1.8rem,8vw,2.35rem); letter-spacing:-.04em; } h2 { margin-bottom:15px; font-size:1.1rem; }
    .eyebrow { margin-bottom:6px; color:var(--leaf); font-size:.82rem; font-weight:800; letter-spacing:.08em; }.intro,.hint,.empty-state,.meta { color:var(--muted); }.intro { margin-bottom:22px; }
    .card { margin-bottom:16px; padding:20px; border:1px solid var(--line); border-radius:18px; background:var(--paper); box-shadow:0 3px 12px rgba(24,49,40,.04); }.total { color:#fff; border:0; background:var(--leaf); }.total p { margin-bottom:0; }.total-label { font-size:.92rem; font-weight:700; }.total-amount { margin-top:8px; font-size:clamp(2rem,11vw,3rem); font-weight:800; letter-spacing:-.045em; }.total-note { margin-top:7px; color:#d8f2e3; font-size:.82rem; }
    form,.form-grid,.item-list { display:grid; gap:14px; } label { display:grid; gap:7px; font-size:.9rem; font-weight:700; } input,select,button { font:inherit; } input,select { width:100%; min-height:46px; padding:10px 12px; border:1px solid #b8c9bd; border-radius:10px; background:#fff; color:var(--ink); } input:focus,select:focus { outline:3px solid #bde2ca; outline-offset:1px; border-color:var(--leaf); } input:disabled { background:#eef2ee; color:#77847c; }
    button { min-height:48px; border:0; border-radius:10px; background:var(--leaf); color:#fff; font-weight:800; cursor:pointer; } button:hover { filter:brightness(.92); } button:focus-visible { outline:3px solid #a9dcb9; outline-offset:2px; }.secondary { background:#52675c; }.clear { width:100%; margin-top:14px; background:#74453e; }.hidden { display:none!important; }.form-error { min-height:1.2em; margin:0; color:var(--danger); font-size:.88rem; font-weight:700; }.session { display:flex; justify-content:space-between; align-items:center; gap:10px; }.session button { min-height:38px; padding:6px 10px; }.item-row { display:grid; gap:10px; padding:15px; border:1px solid var(--line); border-radius:13px; background:#fff; }.item-top,.list-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }.item-name { margin:0; font-size:1rem; font-weight:800; }.remaining { text-align:right; }.remaining span { display:block; }.remaining-label { color:var(--muted); font-size:.75rem; }.remaining-value { margin-top:2px; font-size:1.1rem; font-weight:800; }.metrics { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding-top:11px; border-top:1px solid #edf1ed; }.metric { margin:0; color:var(--muted); font-size:.78rem; }.metric strong { display:block; margin-top:2px; color:var(--ink); font-size:.92rem; }.empty-state { margin:0; padding:20px 4px; text-align:center; }
    @media (min-width:560px) { main { padding:44px 24px 56px; }.form-grid { grid-template-columns:1.35fr 1fr; }.full { grid-column:1 / -1; }.item-row { grid-template-columns:minmax(0,1fr) 160px; }.metrics { grid-column:1 / -1; } }
  </style>
</head>
<body>
  <main>
    <header><p class="eyebrow">屋企日用品</p><h1>記低，先唔會斷貨。</h1><p class="intro">登入後所有庫存資料都由 Supabase RLS 保護。</p></header>
    <section class="card" id="setup-card"><h2>連接及登入</h2><form id="setup-form"><label>Supabase Project URL<input id="supabase-url" type="url" placeholder="https://xxxx.supabase.co" required></label><label>Publishable / anon key<input id="supabase-key" type="password" autocomplete="off" required></label><label>Email<input id="auth-email" type="email" autocomplete="email" required></label><label>Password<input id="auth-password" type="password" autocomplete="current-password" minlength="6" required></label><p class="hint">管理人首次用指定 Gmail 註冊；其他新帳戶會由資料庫自動設為 pending。</p><p id="auth-error" class="form-error" role="alert"></p><button type="submit">登入</button><button id="sign-up" class="secondary" type="button">註冊新帳戶</button></form></section>
    <section class="card hidden" id="session-card"><div class="session"><p id="session-email" class="meta"></p><button id="sign-out" class="secondary" type="button">登出</button></div><p class="hint">資料庫會決定你可以讀取或修改甚麼；pending 不會取得任何庫存資料。</p></section>
    <section class="card total hidden" id="inventory-card" aria-labelledby="total-title"><p id="total-title" class="total-label">本月屋企使費</p><p id="household-total" class="total-amount">HK$0.00</p><p class="total-note">只計本曆月嘅「買咗」</p></section>
    <section class="card hidden" id="entry-card" aria-labelledby="entry-title"><h2 id="entry-title">加入一筆</h2><form id="record-form" novalidate><div class="form-grid"><label class="full">物品名<input id="item-name" type="text" required></label><label>類型<select id="record-type"><option value="purchase">買咗</option><option value="usage">用咗</option></select></label><label>數量<input id="quantity" type="number" inputmode="decimal" min="0.001" step="0.001" required></label><label>金額（港幣）<input id="amount" type="number" inputmode="decimal" min="0" step="0.01" required></label><label>日期<input id="record-date" type="date" required></label></div><p id="form-hint" class="hint">「買咗」需要填金額。</p><p id="record-error" class="form-error" role="alert"></p><button type="submit">加入紀錄</button></form></section>
    <section class="card hidden" id="list-card" aria-labelledby="items-title"><div class="list-head"><h2 id="items-title">而家有咩</h2><p class="meta">按物品整理</p></div><div id="item-list" class="item-list" aria-live="polite"></div><button id="clear-all" class="clear" type="button">清空全部紀錄</button></section>
  </main>
  <script>
    const configKey = 'home-supplies-supabase-config', sessionKey = 'home-supplies-supabase-session';
    const $ = (id) => document.getElementById(id); let records = [];
    const today = () => new Date().toLocaleDateString('en-CA'); const monthKey = (date) => date.slice(0,7); const formatHKD = (amount) => `HK$${Number(amount || 0).toFixed(2)}`;
    const getConfig = () => JSON.parse(localStorage.getItem(configKey) || 'null'); const getSession = () => JSON.parse(localStorage.getItem(sessionKey) || 'null');
    function setError(id, message='') { $(id).textContent = message; }
    function headers() { const config=getConfig(), session=getSession(); return { apikey:config.key, Authorization:`Bearer ${session.access_token}`, 'Content-Type':'application/json' }; }
    async function api(path, options={}) { const config=getConfig(); const response=await fetch(`${config.url.replace(/\/$/,'')}${path}`, {...options, headers:{...headers(), ...(options.headers||{})}}); if (!response.ok) { const body=await response.json().catch(()=>({})); throw new Error(body.message || body.hint || `Request failed (${response.status})`); } return response.status === 204 ? null : response.json(); }
    function showSignedIn() { const session=getSession(); $('setup-card').classList.toggle('hidden',!!session); ['session-card','inventory-card','entry-card','list-card'].forEach(id=>$(id).classList.toggle('hidden',!session)); if(session) $('session-email').textContent=session.user.email || '已登入'; }
    function syncAmount() { const purchase=$('record-type').value==='purchase'; $('amount').disabled=!purchase; $('amount').required=purchase; if(!purchase) $('amount').value=''; $('form-hint').textContent=purchase ? '「買咗」需要填金額。' : '「用咗」毋須填金額。'; }
    function remaining(item) { return records.filter(r=>r.item_name===item).reduce((sum,r)=>sum+(r.record_type==='purchase'?Number(r.quantity):-Number(r.quantity)),0); }
    function render() { const list=$('item-list'), month=monthKey(today()); const total=records.filter(r=>r.record_type==='purchase'&&monthKey(r.recorded_on)===month).reduce((sum,r)=>sum+Number(r.amount||0),0); $('household-total').textContent=formatHKD(total); list.replaceChildren(); const items=[...new Set(records.map(r=>r.item_name))].sort((a,b)=>a.localeCompare(b,'zh-HK')); if(!items.length) { const empty=document.createElement('p'); empty.className='empty-state'; empty.textContent='未有紀錄，加第一筆啦'; list.append(empty); return; } items.forEach(item=>{ const current=records.filter(r=>r.item_name===item&&r.record_type==='purchase'&&monthKey(r.recorded_on)===month); const spend=current.reduce((sum,r)=>sum+Number(r.amount||0),0), qty=current.reduce((sum,r)=>sum+Number(r.quantity),0); const row=document.createElement('article'); row.className='item-row'; row.innerHTML='<div><p class="item-name"></p></div><div class="remaining"><span class="remaining-label">仲剩</span><span class="remaining-value"></span></div><div class="metrics"><p class="metric">呢個月使咗幾多錢<strong></strong></p><p class="metric">本月平均單價<strong></strong></p></div>'; row.querySelector('.item-name').textContent=item; row.querySelector('.remaining-value').textContent=remaining(item); const values=row.querySelectorAll('.metrics strong'); values[0].textContent=formatHKD(spend); values[1].textContent=qty ? formatHKD(spend/qty) : '—'; list.append(row); }); }
    async function loadRecords() { try { records=await api('/rest/v1/records?select=id,item_name,record_type,quantity,amount,recorded_on,created_by,created_at&order=recorded_on.desc,created_at.desc'); render(); setError('record-error'); } catch(error) { records=[]; render(); setError('record-error', `未能讀取庫存：${error.message}`); } }
    async function authenticate(signUp=false) { setError('auth-error'); const url=$('supabase-url').value.trim(), key=$('supabase-key').value.trim(), email=$('auth-email').value.trim(), password=$('auth-password').value; if(!url||!key||!email||!password) return setError('auth-error','請填妥連接及登入資料。'); localStorage.setItem(configKey,JSON.stringify({url,key})); try { const endpoint=signUp?'/auth/v1/signup':'/auth/v1/token?grant_type=password'; const result=await fetch(`${url.replace(/\/$/,'')}${endpoint}`,{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email,password})}); const payload=await result.json(); if(!result.ok) throw new Error(payload.msg||payload.message||'登入失敗'); if(signUp && !payload.access_token) { setError('auth-error','已註冊；請先到 email 驗證帳戶，再登入。'); return; } localStorage.setItem(sessionKey,JSON.stringify(payload)); showSignedIn(); await loadRecords(); } catch(error) { localStorage.removeItem(sessionKey); setError('auth-error',error.message); } }
    $('setup-form').addEventListener('submit',event=>{event.preventDefault(); authenticate(false);}); $('sign-up').addEventListener('click',()=>authenticate(true));
    $('record-type').addEventListener('change',syncAmount); $('record-form').addEventListener('submit',async event=>{ event.preventDefault(); setError('record-error'); const item=$('item-name').value.trim(), quantity=Number($('quantity').value), purchase=$('record-type').value==='purchase', amount=purchase?Number($('amount').value):null; if(!item||!Number.isFinite(quantity)||quantity<=0||!$('record-date').value||(purchase&&(!Number.isFinite(amount)||amount<0))) return setError('record-error','請填妥所有必填資料。'); try { await api('/rest/v1/records',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({item_name:item,record_type:$('record-type').value,quantity,amount,recorded_on:$('record-date').value})}); $('record-form').reset(); $('record-date').value=today(); syncAmount(); await loadRecords(); } catch(error) { setError('record-error',`未能加入紀錄：${error.message}`); } });
    $('clear-all').addEventListener('click',async()=>{ if(!confirm('確定要清空全部紀錄？')) return; try { await api('/rest/v1/records?id=not.is.null',{method:'DELETE',headers:{Prefer:'return=minimal'}}); await loadRecords(); } catch(error) { setError('record-error',`未能清空：${error.message}`); } });
    $('sign-out').addEventListener('click',()=>{localStorage.removeItem(sessionKey); records=[]; showSignedIn();});
    const config=getConfig(); if(config) { $('supabase-url').value=config.url; $('supabase-key').value=config.key; } $('record-date').value=today(); syncAmount(); showSignedIn(); if(getSession()) loadRecords();
  </script>
</body>
</html>
