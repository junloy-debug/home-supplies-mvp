<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>屋企日用品</title>
  <style>
    :root { --ink:#173127; --muted:#66756d; --line:#d8e4db; --paper:#fbfcfa; --leaf:#237552; --danger:#a32626; }
    * { box-sizing:border-box; } body { margin:0; min-width:320px; background:#f0f5f1; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100%,720px); margin:auto; padding:24px 16px 42px; } h1,h2,p { margin-top:0; } h1 { margin:0 0 7px; font-size:clamp(1.8rem,8vw,2.35rem); letter-spacing:-.04em; } h2 { margin-bottom:15px; font-size:1.1rem; }
    .eyebrow { margin-bottom:6px; color:var(--leaf); font-size:.82rem; font-weight:800; letter-spacing:.08em; }.intro,.hint,.empty-state,.meta { color:var(--muted); }.intro { margin-bottom:22px; }
    .card { margin-bottom:16px; padding:20px; border:1px solid var(--line); border-radius:18px; background:var(--paper); box-shadow:0 3px 12px rgba(24,49,40,.04); }.total { color:#fff; border:0; background:var(--leaf); }.total p { margin-bottom:0; }.total-label { font-size:.92rem; font-weight:700; }.total-amount { margin-top:8px; font-size:clamp(2rem,11vw,3rem); font-weight:800; letter-spacing:-.045em; }.total-note { margin-top:7px; color:#d8f2e3; font-size:.82rem; }
    form,.form-grid,.item-list { display:grid; gap:14px; } label { display:grid; gap:7px; font-size:.9rem; font-weight:700; } input,select,button { font:inherit; } input,select { width:100%; min-height:46px; padding:10px 12px; border:1px solid #b8c9bd; border-radius:10px; background:#fff; color:var(--ink); } input:focus,select:focus { outline:3px solid #bde2ca; outline-offset:1px; border-color:var(--leaf); } input:disabled { background:#eef2ee; color:#77847c; }
    button { min-height:48px; border:0; border-radius:10px; background:var(--leaf); color:#fff; font-weight:800; cursor:pointer; } button:hover { filter:brightness(.92); } button:focus-visible { outline:3px solid #a9dcb9; outline-offset:2px; }.secondary { background:#52675c; }.clear { width:100%; margin-top:14px; background:#74453e; }.hidden { display:none!important; }.form-error { min-height:1.2em; margin:0; color:var(--danger); font-size:.88rem; font-weight:700; }.session { display:flex; justify-content:space-between; align-items:center; gap:10px; }.session button { min-height:38px; padding:6px 10px; }.item-row { display:grid; gap:10px; padding:15px; border:1px solid var(--line); border-radius:13px; background:#fff; }.item-top,.list-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }.item-name { margin:0; font-size:1rem; font-weight:800; }.remaining { text-align:right; }.remaining span { display:block; }.remaining-label { color:var(--muted); font-size:.75rem; }.remaining-value { margin-top:2px; font-size:1.1rem; font-weight:800; }.metrics { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding-top:11px; border-top:1px solid #edf1ed; }.metric { margin:0; color:var(--muted); font-size:.78rem; }.metric strong { display:block; margin-top:2px; color:var(--ink); font-size:.92rem; }.empty-state { margin:0; padding:20px 4px; text-align:center; }
    .status { margin:5px 0 0; color:var(--danger); font-size:.86rem; font-weight:800; }.threshold { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:.8rem; }.threshold input { width:82px; min-height:38px; padding:7px 8px; }
    @media (min-width:560px) { main { padding:44px 24px 56px; }.form-grid { grid-template-columns:1.35fr 1fr; }.full { grid-column:1 / -1; }.item-row { grid-template-columns:minmax(0,1fr) 160px; }.metrics,.threshold { grid-column:1 / -1; }.threshold { justify-self:start; } }
  </style>
</head>
<body>
  <main>
    <header><p class="eyebrow">屋企日用品</p><h1>記低，先唔會斷貨。</h1><p class="intro">登入後所有庫存資料都由 Supabase RLS 保護。</p></header>
    <section class="card" id="setup-card"><h2>連接及登入</h2><form id="setup-form"><label>Supabase Project URL<input id="supabase-url" type="url" placeholder="https://xxxx.supabase.co" required></label><label>Publishable / anon key<input id="supabase-key" type="password" autocomplete="off" required></label><label>Email<input id="auth-email" type="email" autocomplete="email" required></label><label>Password<input id="auth-password" type="password" autocomplete="current-password" minlength="6" required></label><p class="hint">管理人首次用指定 Gmail 註冊；其他新帳戶會由資料庫自動設為 pending。</p><p id="auth-error" class="form-error" role="alert"></p><button type="submit">登入</button><button id="sign-up" class="secondary" type="button">註冊新帳戶</button><button id="sign-in-google" class="secondary" type="button">以 Google 登入</button></form></section>
    <section class="card hidden" id="session-card"><div class="session"><p class="meta"><span id="session-email"></span> · <span id="session-role">讀取身分中</span></p><button id="sign-out" class="secondary" type="button">登出</button></div><p class="hint">資料庫會決定你可以讀取或修改甚麼；pending 不會取得任何庫存資料。</p></section>
    <section class="card total hidden" id="inventory-card" aria-labelledby="total-title"><p id="total-title" class="total-label">本月屋企使費</p><p id="household-total" class="total-amount">HK$0.00</p><p class="total-note">只計本曆月嘅「買咗」</p></section>
    <section class="card hidden" id="entry-card" aria-labelledby="entry-title"><h2 id="entry-title">加入一筆</h2><form id="record-form" novalidate><div class="form-grid"><label class="full">物品名<input id="item-name" type="text" placeholder="例如：廁紙" required></label><label>類型<select id="record-type"><option value="買咗">買咗</option><option value="用咗">用咗</option></select></label><label>數量<input id="quantity" type="number" inputmode="decimal" min="0.01" step="any" placeholder="例如：2" required></label><label>金額（港幣）<input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="例如：28.00" required></label><label>日期<input id="record-date" type="date" required></label></div><p id="form-hint" class="hint">「買咗」需要填金額。</p><p id="record-error" class="form-error" role="alert"></p><button type="submit">加入紀錄</button></form></section>
    <section class="card hidden" id="list-card" aria-labelledby="items-title"><div class="list-head"><h2 id="items-title">而家有咩</h2><p class="meta">按物品整理</p></div><div id="item-list" class="item-list" aria-live="polite"></div><button id="clear-all" class="clear" type="button">清空全部紀錄</button></section>
  </main>
  <script>
    const configKey = 'home-supplies-supabase-config', sessionKey = 'home-supplies-supabase-session';
    const legacyStorageKey = 'home-supplies-records', legacyMigrationKey = 'home-supplies-legacy-migration-v1';
    const $ = (id) => document.getElementById(id); let records = [], thresholds = {};
    const monthKey = (date) => date.slice(0, 7); const currentMonth = () => monthKey(today());
    function today() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function parseCents(value) { const match = String(value).trim().match(/^(\d+)(?:\.(\d{1,2}))?$/); return match ? Number(match[1]) * 100 + Number((match[2] || '').padEnd(2,'0')) : null; }
    const formatHKD = (cents) => `HK$${(cents / 100).toFixed(2)}`;
    const getConfig = () => JSON.parse(localStorage.getItem(configKey) || 'null'); const getSession = () => JSON.parse(localStorage.getItem(sessionKey) || 'null');
    function setError(id, message='') { $(id).textContent = message; }
    function headers() { const config=getConfig(), session=getSession(); return { apikey:config.key, Authorization:`Bearer ${session.access_token}`, 'Content-Type':'application/json' }; }
    async function refreshSession() { const config=getConfig(), session=getSession(); if(!config||!session?.refresh_token) throw new Error('登入已過期，請重新登入'); const response=await fetch(`${config.url.replace(/\/$/,'')}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:config.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})}); const payload=await response.json(); if(!response.ok) throw new Error(payload.message||'登入已過期，請重新登入'); localStorage.setItem(sessionKey,JSON.stringify(payload)); }
    async function api(path, options={}, retry=true) { const config=getConfig(); let response=await fetch(`${config.url.replace(/\/$/,'')}${path}`, {...options, headers:{...headers(), ...(options.headers||{})}}); if(response.status===401&&retry) { await refreshSession(); response=await fetch(`${config.url.replace(/\/$/,'')}${path}`, {...options, headers:{...headers(), ...(options.headers||{})}}); } if(!response.ok) { const body=await response.json().catch(()=>({})); throw new Error(body.message||body.hint||`Request failed (${response.status})`); } return response.status===204?null:response.json(); }
    function showSignedIn() { const session=getSession(); $('setup-card').classList.toggle('hidden',!!session); ['session-card','inventory-card','entry-card','list-card'].forEach(id=>$(id).classList.toggle('hidden',!session)); if(session) $('session-email').textContent=session.user.email || '已登入'; }
    function syncAmount() { const buying=$('record-type').value==='買咗'; $('amount').disabled=!buying; $('amount').required=buying; if(!buying) $('amount').value=''; $('form-hint').textContent=buying ? '「買咗」需要填金額。' : '「用咗」毋須填金額。'; }
    function remaining(sourceRecords, item) { return sourceRecords.filter(r => r.item === item).reduce((sum, r) => sum + (r.type === '買咗' ? r.quantity : -r.quantity), 0); }
    function canUseQuantity(sourceRecords, item, quantity) { return Number(quantity) <= remaining(sourceRecords, item); }
    function itemSummary(sourceRecords, item) { const now=currentMonth(); let spend=0, boughtQuantity=0; sourceRecords.forEach(r=>{ if(r.item===item&&r.type==='買咗'&&monthKey(r.date)===now) { spend+=r.amount; boughtQuantity+=r.quantity; } }); return { remaining:remaining(sourceRecords,item), spend, average:boughtQuantity?Math.round(spend/boughtQuantity):null }; }
    function statusFor(summary, threshold) { if(threshold===undefined) return ''; if(summary.remaining===0) return '用完咗'; if(summary.remaining>0&&summary.remaining<=threshold) return '就快用完'; return ''; }
    function render() { const list=$('item-list'); const total=records.filter(r=>r.type==='買咗'&&monthKey(r.date)===currentMonth()).reduce((sum,r)=>sum+r.amount,0); $('household-total').textContent=formatHKD(total); list.replaceChildren(); const items=[...new Set(records.map(r=>r.item))].sort((a,b)=>a.localeCompare(b,'zh-HK')); if(!items.length) { const empty=document.createElement('p'); empty.className='empty-state'; empty.textContent='未有紀錄，加第一筆啦'; list.append(empty); return; } items.forEach(item=>{ const summary=itemSummary(records,item), threshold=thresholds[item], status=statusFor(summary,threshold); const row=document.createElement('article'); row.className='item-row'; row.innerHTML='<div><p class="item-name"></p><p class="status"></p></div><div class="remaining"><span class="remaining-label">仲剩</span><span class="remaining-value"></span></div><div class="metrics"><p class="metric">呢個月使咗幾多錢<strong></strong></p><p class="metric">本月平均單價<strong></strong></p></div><label class="threshold">低量門檻<input type="number" min="0" step="any" placeholder="未設定"></label>'; row.querySelector('.item-name').textContent=item; row.querySelector('.remaining-value').textContent=summary.remaining; const values=row.querySelectorAll('.metrics strong'); values[0].textContent=formatHKD(summary.spend); values[1].textContent=summary.average===null?'—':formatHKD(summary.average); const statusNode=row.querySelector('.status'); statusNode.textContent=status; if(!status) statusNode.remove(); const thresholdInput=row.querySelector('.threshold input'); if(threshold!==undefined) thresholdInput.value=threshold; thresholdInput.addEventListener('change',()=>saveThreshold(item,thresholdInput.value)); list.append(row); }); }
    const fromDatabase = row => ({ id:row.id, item:row.item_name, type:row.record_type==='purchase'?'買咗':'用咗', quantity:Number(row.quantity), amount:Math.round(Number(row.amount||0)*100), date:row.recorded_on });
    async function loadRecords() { try { const rows=await api('/rest/v1/records?select=id,item_name,record_type,quantity,amount,recorded_on,low_stock_threshold,created_by,created_at&order=recorded_on.desc,created_at.desc'); records=rows.map(fromDatabase); thresholds={}; rows.forEach(row=>{ if(row.low_stock_threshold!==null&&thresholds[row.item_name]===undefined) thresholds[row.item_name]=Number(row.low_stock_threshold); }); render(); setError('record-error'); } catch(error) { records=[]; thresholds={}; render(); setError('record-error', `未能讀取庫存：${error.message}`); } }
    async function saveThreshold(item, raw) { const value=raw.trim()===''?null:Number(raw); try { await api(`/rest/v1/records?item_name=eq.${encodeURIComponent(item)}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({low_stock_threshold:value})}); if(value===null) delete thresholds[item]; else thresholds[item]=value; render(); } catch(error) { setError('record-error',`未能更新低量門檻：${error.message}`); } }
    async function loadMemberProfile() { const session=getSession(); if(!session) return; try { const rows=await api(`/rest/v1/members?select=role&user_id=eq.${encodeURIComponent(session.user.id)}`); const labels={manager:'管理人',clerk:'店員',viewer:'親友（唯讀）',pending:'pending'}; $('session-role').textContent=rows[0]?labels[rows[0].role]||rows[0].role:'未有身分'; } catch { $('session-role').textContent='未能讀取身分'; } }
    function readLegacyState() { try { const value=JSON.parse(localStorage.getItem(legacyStorageKey)||'null'); if(Array.isArray(value)) return {records:value,thresholds:{}}; if(value&&Array.isArray(value.records)) return {records:value.records,thresholds:value.thresholds||{}}; } catch {} return {records:[],thresholds:{}}; }
    async function migrateLegacyRecords() { if(localStorage.getItem(legacyMigrationKey)==='done') return; const legacy=readLegacyState(); if(!legacy.records.length) { localStorage.setItem(legacyMigrationKey,'done'); return; } const payload=legacy.records.map((r,index)=>({legacy_id:`day1:${r.id||`${r.item}|${r.type}|${r.date}|${index}`}`,low_stock_threshold:legacy.thresholds[r.item]??null,item_name:r.item,record_type:r.type==='買咗'?'purchase':'usage',quantity:Number(r.quantity),amount:r.type==='買咗'?Number(r.amount)/100:null,recorded_on:r.date})); await api('/rest/v1/records?on_conflict=legacy_id',{method:'POST',headers:{Prefer:'resolution=ignore-duplicates,return=minimal'},body:JSON.stringify(payload)}); localStorage.setItem(legacyMigrationKey,'done'); }
    async function syncSignedInData() { await loadMemberProfile(); let migrationError=''; try { await migrateLegacyRecords(); } catch(error) { migrationError=`Day 1 舊紀錄未能搬去 Supabase：${error.message}`; } await loadRecords(); if(migrationError) setError('record-error',migrationError); }
    async function authenticate(signUp=false) { setError('auth-error'); const url=$('supabase-url').value.trim(), key=$('supabase-key').value.trim(), email=$('auth-email').value.trim(), password=$('auth-password').value; if(!url||!key||!email||!password) return setError('auth-error','請填妥連接及登入資料。'); localStorage.setItem(configKey,JSON.stringify({url,key})); try { const endpoint=signUp?'/auth/v1/signup':'/auth/v1/token?grant_type=password'; const result=await fetch(`${url.replace(/\/$/,'')}${endpoint}`,{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email,password})}); const payload=await result.json(); if(!result.ok) throw new Error(payload.msg||payload.message||'登入失敗'); if(signUp && !payload.access_token) { setError('auth-error','已註冊；請先到 email 驗證帳戶，再登入。'); return; } localStorage.setItem(sessionKey,JSON.stringify(payload)); showSignedIn(); await syncSignedInData(); } catch(error) { localStorage.removeItem(sessionKey); setError('auth-error',error.message); } }
    async function signInWithGoogle() { setError('auth-error'); const url=$('supabase-url').value.trim(), key=$('supabase-key').value.trim(); if(!url||!key) return setError('auth-error','請先填寫 Supabase Project URL 同 publishable key。'); localStorage.setItem(configKey,JSON.stringify({url,key})); window.location.assign(`${url.replace(/\/$/,'')}/auth/v1/authorize?provider=google&redirect_to=${encodeURIComponent(window.location.origin)}`); }
    async function restoreOAuthSession() { const accessToken=new URLSearchParams(window.location.hash.slice(1)).get('access_token'); if(!accessToken) return false; const config=getConfig(); if(!config) return false; try { const response=await fetch(`${config.url.replace(/\/$/,'')}/auth/v1/user`,{headers:{apikey:config.key,Authorization:`Bearer ${accessToken}`}}); const user=await response.json(); if(!response.ok) throw new Error(user.message||'未能讀取登入帳戶'); const hash=new URLSearchParams(window.location.hash.slice(1)); localStorage.setItem(sessionKey,JSON.stringify({access_token:accessToken,refresh_token:hash.get('refresh_token'),user})); history.replaceState(null,'',window.location.pathname+window.location.search); return true; } catch(error) { setError('auth-error',error.message); return false; } }
    $('setup-form').addEventListener('submit',event=>{event.preventDefault(); authenticate(false);}); $('sign-up').addEventListener('click',()=>authenticate(true));
    $('sign-in-google').addEventListener('click',signInWithGoogle);
    $('record-type').addEventListener('change',syncAmount); $('record-form').addEventListener('submit',async event=>{ event.preventDefault(); setError('record-error'); const item=$('item-name').value.trim(), quantity=Number($('quantity').value), type=$('record-type').value, cents=type==='買咗'?parseCents($('amount').value):0; if(!item||!Number.isFinite(quantity)||quantity<=0||!$('record-date').value||(type==='買咗'&&cents===null)) return setError('record-error','請填妥所有必填資料。'); if(type==='用咗'&&!canUseQuantity(records,item,quantity)) return setError('record-error','數量唔可以多過現有存貨'); try { await api('/rest/v1/records',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({item_name:item,record_type:type==='買咗'?'purchase':'usage',quantity,amount:type==='買咗'?cents/100:null,recorded_on:$('record-date').value,low_stock_threshold:thresholds[item]??null})}); $('record-form').reset(); $('record-date').value=today(); syncAmount(); await loadRecords(); } catch(error) { setError('record-error',`未能加入紀錄：${error.message}`); } });
    $('clear-all').addEventListener('click',async()=>{ if(!confirm('確定要清空全部紀錄？')) return; try { await api('/rest/v1/records?id=not.is.null',{method:'DELETE',headers:{Prefer:'return=minimal'}}); await loadRecords(); } catch(error) { setError('record-error',`未能清空：${error.message}`); } });
    function selfCheck() { const assert=(condition,message)=>{ if(!condition) throw new Error(message); }; const stock=[{item:'EGG',type:'買咗',quantity:2,amount:1000,date:today()}]; assert(remaining(stock,'EGG')===2,'餘量計算錯誤'); assert(canUseQuantity(stock,'EGG',3)===false,'超用存貨應被拒絕'); const summary=itemSummary(stock,'EGG'); assert(summary.spend===1000&&summary.average===500,'本月使費或平均單價計算錯誤'); assert(statusFor({remaining:0},1)==='用完咗','低量狀態計算錯誤'); return true; }
    $('sign-out').addEventListener('click',()=>{localStorage.removeItem(sessionKey); records=[]; showSignedIn();});
    const config=getConfig(); if(config) { $('supabase-url').value=config.url; $('supabase-key').value=config.key; } $('record-date').value=today(); syncAmount(); selfCheck(); restoreOAuthSession().then(restored=>{ showSignedIn(); if(restored||getSession()) syncSignedInData(); });
  </script>
</body>
</html>
