<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>香港天氣</title>
  <style>
    :root { color-scheme: light; --ink: #10243b; --muted: #5d6c7c; --sky: #eaf6ff; --blue: #0879d1; --card: #fff; --warning: #9d3415; --warning-bg: #fff0df; --stale: #765600; --stale-bg: #fff7c2; --error: #9e1c1c; --error-bg: #ffe5e5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(155deg, #bce5ff 0, var(--sky) 43%, #f5fbff 100%); }
    main { width: min(100%, 720px); min-height: 100vh; margin: 0 auto; padding: 24px 16px 36px; }
    .eyebrow { margin: 0 0 4px; color: var(--blue); font-weight: 700; letter-spacing: .08em; font-size: .78rem; }
    h1 { margin: 0; font-size: clamp(1.65rem, 7vw, 2.3rem); }
    .updated { margin: 8px 0 22px; color: var(--muted); font-size: .9rem; }
    .status-banner { margin: 16px 0; padding: 14px 16px; border-radius: 14px; font-weight: 600; line-height: 1.55; }
    .status-banner.stale { color: var(--stale); background: var(--stale-bg); border: 1px solid #e4c94e; }
    .status-banner.source-stale { color: #7a3f00; background: #fff0d5; border: 1px solid #e7ad61; }
    .status-banner.error { color: var(--error); background: var(--error-bg); border: 1px solid #efaaaa; }
    .card { background: rgba(255,255,255,.9); border: 1px solid rgba(16,36,59,.08); border-radius: 20px; box-shadow: 0 10px 28px rgba(16,73,120,.09); }
    .current { padding: 22px; }
    .current h2, .forecast-title { margin: 0; font-size: 1rem; }
    .stats { display: grid; grid-template-columns: 1.25fr .75fr; gap: 12px; margin-top: 17px; }
    .stat { padding: 15px; border-radius: 15px; background: #f2f9fe; }
    .stat span { display: block; color: var(--muted); font-size: .83rem; }
    .stat strong { display: block; margin-top: 2px; color: var(--blue); font-size: clamp(2rem, 12vw, 3.8rem); line-height: 1.05; letter-spacing: -.06em; }
    .stat.humidity strong { font-size: clamp(1.7rem, 9vw, 2.65rem); }
    .unit { font-size: .45em; letter-spacing: 0; vertical-align: 15%; }
    #warning-area:empty { display: none; }
    .warning { margin-top: 16px; padding: 16px; color: var(--warning); background: var(--warning-bg); border: 1px solid #f3c58f; border-radius: 15px; line-height: 1.55; }
    .warning strong { display: block; margin-bottom: 4px; }
    .forecast { margin-top: 22px; }
    .forecast-title { margin: 0 0 10px 4px; }
    #forecast-list { display: grid; gap: 9px; }
    .day { display: grid; grid-template-columns: 88px 1fr auto; gap: 10px; align-items: center; padding: 14px; }
    .date { font-weight: 700; line-height: 1.3; }
    .weekday { display: block; color: var(--muted); font-size: .8rem; font-weight: 400; }
    .description { color: #344a61; font-size: .9rem; line-height: 1.4; }
    .temperatures { color: var(--blue); white-space: nowrap; font-size: .9rem; font-weight: 700; text-align: right; }
    footer { margin-top: 24px; padding: 0 4px; color: var(--muted); font-size: .78rem; line-height: 1.6; }
    footer a { color: inherit; font-weight: 700; }
    @media (max-width: 390px) { main { padding-inline: 12px; } .day { grid-template-columns: 72px 1fr; } .temperatures { grid-column: 2; text-align: left; } .description { font-size: .84rem; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">香港天氣</p>
    <h1>今日天氣概況</h1>
    <div id="status-banner" aria-live="assertive"></div>
    <div id="source-status-banner" aria-live="assertive"></div>
    <p class="updated" id="updated"></p>

    <section class="card current" aria-labelledby="current-title">
      <h2 id="current-title">而家</h2>
      <div class="stats">
        <div class="stat"><span>氣溫</span><strong id="temperature"></strong></div>
        <div class="stat humidity"><span>相對濕度</span><strong id="humidity"></strong></div>
      </div>
      <div id="warning-area" aria-live="polite"></div>
    </section>

    <section class="forecast" aria-labelledby="forecast-title">
      <h2 class="forecast-title" id="forecast-title">未來幾日預報</h2>
      <div id="forecast-list"></div>
    </section>

    <footer>
      資料來源：香港天文台，經 <a href="https://data.gov.hk/tc/" rel="external">DATA.GOV.HK</a> 提供。政府、香港天文台及相關機構保留相關知識產權。
    </footer>
  </main>

  <script>
    const text = (value) => document.createTextNode(value);

    function formatFetchedAt(value) {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Hong_Kong', year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
      }).formatToParts(new Date(value));
      const part = (type) => parts.find(item => item.type === type).value;
      return `${part('year')}-${part('month')}-${part('day')} ${part('hour')}:${part('minute')} 更新`;
    }

    function formatDate(value) {
      return `${value.slice(0, 4)}-${value.slice(4, 6)}-${value.slice(6, 8)}`;
    }

    function formatAge(milliseconds) {
      const totalHours = Math.floor(milliseconds / (60 * 60 * 1000));
      const days = Math.floor(totalHours / 24);
      const hours = totalHours % 24;
      return days ? `${days} 日 ${hours} 小時` : `${hours} 小時`;
    }

    function showStatus(type, message, selector = '#status-banner') {
      const banner = document.querySelector(selector);
      banner.className = `status-banner ${type}`;
      banner.textContent = message;
    }

    function addWarning(message) {
      const box = document.createElement('div');
      box.className = 'warning';
      const title = document.createElement('strong');
      title.textContent = '天氣警告';
      box.append(title, text(message));
      document.querySelector('#warning-area').append(box);
    }

    function setValue(selector, value, unit) {
      const target = document.querySelector(selector);
      target.replaceChildren(text(String(value)));
      const unitElement = document.createElement('span');
      unitElement.className = 'unit';
      unitElement.textContent = unit;
      target.append(unitElement);
    }

    function addForecast(day) {
      const row = document.createElement('article');
      row.className = 'card day';
      const date = document.createElement('div');
      date.className = 'date';
      date.append(text(formatDate(day.date)));
      const weekday = document.createElement('span');
      weekday.className = 'weekday';
      weekday.textContent = day.weekday;
      date.append(weekday);
      const description = document.createElement('div');
      description.className = 'description';
      description.textContent = day.description;
      const temperatures = document.createElement('div');
      temperatures.className = 'temperatures';
      temperatures.textContent = `${day.maxTemperature}° / ${day.minTemperature}°`;
      row.append(date, description, temperatures);
      document.querySelector('#forecast-list').append(row);
    }

    fetch('data/weather.json')
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(weather => {
        if (!weather.fetchedAt || !weather.current || !Array.isArray(weather.forecast)) {
          throw new Error('資料格式不完整');
        }
        setValue('#temperature', weather.current.temperature, '°C');
        setValue('#humidity', weather.current.humidity, '%');
        document.querySelector('#updated').textContent = formatFetchedAt(weather.fetchedAt);
        weather.current.warnings.forEach(addWarning);
        weather.forecast.forEach(addForecast);
        const age = Date.now() - new Date(weather.fetchedAt).getTime();
        if (!Number.isFinite(age)) throw new Error('fetchedAt 無效');
        if (age > 8 * 60 * 60 * 1000) {
          showStatus('stale', `⚠️ 天氣資料已過期：此資料於 ${formatFetchedAt(weather.fetchedAt)} 攞取，現時已經 ${formatAge(age)} 舊。`);
        }
        const sourceAge = Date.now() - new Date(weather.current.hkoUpdateTime).getTime();
        if (Number.isFinite(sourceAge) && sourceAge > 12 * 60 * 60 * 1000) {
          showStatus('source-stale', `⚠️ 來源數據停咗：香港天文台最後發佈時間係 ${formatFetchedAt(weather.current.hkoUpdateTime)}，現時已經 ${formatAge(sourceAge)} 冇更新。`, '#source-status-banner');
        }
      })
      .catch(() => showStatus('error', '未能攞到最新天氣資料，請稍後再試。'));
  </script>
</body>
</html>
